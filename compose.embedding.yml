services:
  embedding:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    cpus: 4
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_CONTEXT_LENGTH: ${MODEL_CHAT_CONTEXT_WINDOW_TOKENS:-4096}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '8'
      OLLAMA_KEEP_ALIVE: 1m
    ports:
      - '127.0.0.1:${EMBEDDING_PORT:-11435}:11434'
    volumes:
      - ${MODEL_STORAGE_PATH:-./data/embedding}:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
