[[entry]]
id = 5
type = "story"
title = "Verify билета: claim ≤ ceiling + связка claim↔descriptor + descriptorSha256 (AD-3, AD-2)"
description = "verifyHostedMcpTicket (ticket.ts:79-148) расширяется: HMAC + exp + форма + claim ≤ ceiling (ceiling — единый источник, entry 2) + связка claim.artifactSha256 с верифицированным дескриптором. Hosted-билет несёт server-issued descriptorSha256 — клиент сверяет descriptor-текст именно с ним (self-referential hash из самого пакета запрещён). Текущая админ-политика в verify не участвует (лимиты = admission-контроль при публикации). Миграционный коммит: env-лимиты клиента (NEUROCENTER_RUNTIME_MAX_*) полностью удаляются — параллельный env-путь не существует даже на переход; клиент применяет min(descriptor.limits, ceiling). limits — обязательное поле: отсутствует/некорректно = invalid descriptor, bridge не устанавливает (fail-closed — «нет limits → env/ceiling» запрещено). Версия фиксируется при issuance: head резолвится сервером и фиксируется в дескрипторе и claim; version=undefined (head) в прямом каталожном пути запрещён — 404 actionable «перезапроси дескриптор»."
verify = "verify: claim ≤ ceiling (ceiling из единого источника); claim.artifactSha256 сверяется с descriptorSha256 (self-referential hash отвергнут); descriptor без limits → invalid (fail-closed); env-лимиты клиента удалены (grep); min(descriptor.limits, ceiling) применяется; version=undefined → actionable 404; корневой сьют — без деградации."
covers = ["R12"]
after = [2, 3, 4]
hitl = false
risk = "high"

