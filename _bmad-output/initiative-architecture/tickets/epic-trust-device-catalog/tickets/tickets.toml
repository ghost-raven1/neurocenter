description = "TTL билета 24h (было 30d, ticket.ts:53); bridge ре-выпускает билет при reconnect (connect — лёгкий, ре-подпись HMAC) и САМ обновляет свой OpenCode-конфиг (installation-planner.ts:213-222 — сейчас «Билет живёт до истечения: обновление и восстановление не переподключают канал»). Gateway проверяет привязку device↔project и активность устройства (authorize-session, host.ts:342-364) lookup'ом с кэшем ≤60s; ЕДИНЫЙ кэш для connect-lookup и per-op re-check (сейчас полная DB-транзакция на каждую операцию — mcp-host-access.ts:201); lookup error/timeout → 503, соединение отклоняется — fail-closed, stale-while-error запрещён. Окно отзыва ≤ TTL кэша (60s); per-ticket denylist не вводится. Глобальный пул (default 4, host.ts:40 — закрыть NaN-дыру) ограничен per-project/per-device квотами + cap активных каналов на hostKey; child-MCP-процесс — pids_limit + non-root (compose api-gateway: сейчас ни того ни другого, только shared x-service no-new-privileges; owned-stdio.ts:25-31 spawn detached). Live re-check на соединение И на каждую операцию (ListTools/CallTool)."
