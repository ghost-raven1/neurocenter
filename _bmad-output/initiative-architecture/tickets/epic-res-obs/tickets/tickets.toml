[[entry]]
id = 24
type = "story"
title = "BUG (RES-01 block д, e2e driver): correlation-блок непроходим для успешных запросов — драйвер гребёт client-id, который nginx перезаписывает, и требует gateway-строку, которую успешный запрос не даёт"
description = "RES-01 блок (д) «логи: correlation + redaction» — e2e-драйвер (scripts/test/res-01-e2e.mjs, runCorrelation) = RED на healthy-стеке. Два независимых дефекта ДИЗАЙНА ТЕСТА (не production-кода): (1) nginx-конф (frontend/conf.d/default.conf) в каждом прокси-локации делает `proxy_set_header X-Request-ID $request_id;` — ЗАГОЛОВОК КЛИЕНТА ПЕРЕЗАПИСЫВАЕТСЯ собственным $request_id nginx (ратификация AD-O2: «Единый источник: nginx $request_id (уже шлёт — ратификация)»). Драйвер генерирует свой correlationId (32 hex), шлёт его заголовком x-request-id и гребёт ВСЕ логи (docker compose logs) по ЭТОМУ id — но nginx-строка access-лога несёт $request_id NGINX (другое значение), а не client-id → ни один слой не матчится. Доказано live: POST /api/errors/client 201, nginx requestId=73b8cc30… — grep по client-id по всем 6 сервисам = 0; grep по $request_id nginx — gateway/catalog строк НЕТ (см. п.2). (2) gateway и сервисы НЕ пишут per-request SUCCESS-логи (только error/warn: gateway log.error 'proxy error'/'upstream 5xx'/'auth check failed', client-error.log.warn при недоставке). endToEnd-критерий драйвера = nginx && gateway (строка с id в access-логе + строка в gateway-логе) — успешный запрос НЕ даёт gateway-строку → блок НЕПРЕОДОЛИМО red для успешных запросов. Production-корреляция ПРОВЕРЕМА и ПРАВИЛЬНА: shared/request-context.cjs createRequestContextMiddleware уважает входящий X-Request-ID (валидирует REQUEST_ID_PATTERN, иначе UUID4), контекст AsyncLocalStorage, internal-вызовы injectRequestContext/requestContextHeaders всегда несут заголовок — т.е. $request_id nginx действительно сквозной nginx→gateway→сервис; просто видим в логах только там, где СЛУЖБА что-то логит (error/warn/аудит/crash). Дефект предшествует res-obs (nginx-конф + request-context — более ранние эпики; e2e-драйвер — артефакт 6.15). Фикс (требование, в ДРАЙВЕРЕ — тест-артефакт, не production-код): (1) не слать/не ждать свой id — ПОСЛЕ запроса читать requestId из nginx access-лог-строки (time+path) и гребать по НЕМУ; (2) endToEnd-критерий только для слоёв, которые реально логят для данного запроса, ИЛИ гнать запрос, дающий downstream-строку (error/warn-путь: напр. client-error-недоставка 502, upstream 5xx, или crash-блок е) — для successful-200 service/gateway-строки не ожидается (driver уже помечает service 'ожидается, если запрос дошёл до сервиса' — распространить ту же семантику на gateway); (3) redaction-ассерты (ticket m/:ticket → REDACTED, error.message) — оставить, но гнать по реальному id. Альтернатива (если решение «тест = только error-путь»): задокументировать в ранбуке, что (д) исполняется по запросу, порождающему downstream-лог (связать с блоком е/ж)."
verify = "runCorrelation GREEN на healthy-стеке: requestId из nginx access-лог-строки найден во всех слоях, которые для данного запроса реально логят; для successful-200 — nginx-строка обязательна, gateway/service — только если есть downstream-лог; redaction-ассерты (нет сырого m/:ticket, нет error.message в access/error-строках) проходят. Production-код сервисов НЕ меняется (фикс — в scripts/test/res-01-e2e.mjs)."
covers = ["R9"]
after = []
hitl = false
risk = "medium"

