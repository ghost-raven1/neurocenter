title = "Quota enforcement: enforcement-точки projects.quota (AD-D4)"
description = "AD-D4: любое quota-поле в API/DB обязано иметь enforcement-точку (файл) и тест; квотная модель (persistent used-bytes accounting + schema + API) — epic-data entry 1, здесь — только enforcement (сравнение с лимитом до записи). Enforcement-точки: (1) RAG-пакетная запись (rag-sync): до записи used+оценка ≤ retentionBytesLimit (оценка — паттерн max(16MiB, 6×JSON) capacity.cjs); (2) сохранение/создание skill (skills-service): до записи used+оценка ≤ currentBytesLimit; (3) staging-измерение (in-flight uploads/импорты) — список точек = OQ; artifact-cache — enforcement = eviction (epic-data entry 2), здесь только boundary-тест. Отказ: явное сообщение (паттерн CapacityError 507/503), quota-rejection-метрика, safe-лог; limit=0 ⇒ unlimited (enforcement не применяется). Инвариант-тест: 6 полей quota → каждое либо enforcement-точка+тест, либо явно «не enforce'ится» (тогда — удалить из API, AD-D4). after epic-level: epic-data entry 1 (accounting API)."
