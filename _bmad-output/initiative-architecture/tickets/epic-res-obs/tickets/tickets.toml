type = "story"
title = "BUG (RES-01 stage 2, AD-O6): канал доставки алертов не проведён end-to-end — в prometheus.yml отсутствует секция alerting (prometheus не пушит алерты в alertmanager)"
description = "RES-01 stage 2 (2026-11-24, блок г): «доставлено» (строка в alerts.jsonl) никогда не появлялось. Диагностика: prometheus evaluates правила и алерт firing в /api/v1/alerts (NeurocenterServiceUnavailable после stop skills-service: up=0 с 03:03:00, pending 03:03:11.657, firing по for:1m ~03:04:11), НО alertmanager пустой (/api/v2/alerts = []) — в prometheus.yml (и в репо, и в live-маунте) НЕТ секции alerting: → prometheus не знает ни одного alertmanager-target → ничего не пушит. Весь остальной канал AD-O6 собран и корректен, но мёртв: alertmanager.yml (deploy/production/monitoring) — webhook file-sink http://host.docker.internal:9111/alerts (send_resolved: true, group_by [alertname, severity], group_wait 30s), extra_hosts host-gateway у alertmanager+prometheus, host-receiver (scripts/production/alert-receiver.mjs + deploy/production/alert-receiver.service). Defect в res-obs-артефакте: entry 13 (commit 28940fa6) добавил alertmanager.yml + правила, но не добавил проводку prometheus→AM. Фикс (репо): добавить в prometheus.yml секцию alerting: / alertmanagers: / - static_configs: / - targets: ['alertmanager:9093'] (оба сервиса в backend-сети, AM 9093 internal). Stand-фиксюр (исполнен, приёмка прошла): /tmp/opencode/nc-res01-monitoring = копия deploy/production/monitoring с добавленной alerting-секцией, подмешана volumes-override'ом acceptance-overlay; receiver на хосте: ALERTS_FILE=/home/region.cbr.ru/69starodubtsevae/.nc-res01/alerts.jsonl node scripts/production/alert-receiver.mjs. После: firing-строки (03:13:41.69x: ServiceUnavailable skills + ExternalBackupOverdue catalog + CapacityUnavailable x2) и resolved-строка (03:18:41.681, ServiceUnavailable, endsAt 03:15:11.657 = реальное время resolve) доставлены. Наблюдения приёмки (к докам AD-O6): (a) AM v0.32.1 доставляет resolved-уведомление НЕ в момент resolve, а на цикле group_interval (наблюдение: resolve 03:15:11.657 → resolved-строка 03:18:41.681 = firing-уведомление + ровно 5m = group_interval) — при group_interval: 5m оператор ждёт до 5m до resolved-сигнала; зафиксировать в доке семантику. (b) Docker-демон стенда инжектит HTTP(S)_PROXY во ВСЕ контейнеры; node-сервисы защищены явным NO_PROXY в x-runtime, а внешние образы (frontend/nginx, prometheus, alertmanager) получают короткий daemon-no_proxy (localhost,127.0.0.1,::1) — proxy-aware-инструменты внутри них (wget) гонят внутренний сервис-трафик через корпоративный прокси 172.17.0.1:3128 → 502 от прокси, похожий на production-сбой (наблюдение: wget из frontend в api-gateway:4000/ready → 502 через прокси; bypass прокси → 200). НЕ production-дефект (nginx/node-рантайм env-proxy не используют; webhook-клиент AM также не ушёл в прокси — доставка прошла напрямую), но диагностическая ловушка + зафиксировать в доке. (c) Предсуществующее состояние стенда: neurocenter_capacity_snapshot_available == 0 у catalog/rag/skills (алерт NeurocenterCapacityUnavailable firing: rag с 11-23 13:07 (с момента stack-up), catalog с 02:52:11 (после D7-restart), skills с 03:16:11 (после restore)) — capacity-collector healthy, логи пусты, снапшоты не генерируются; влияет на блок г1 (NeurocenterDiskSpaceLow тоже на capacity-снапшотах) — диагностировать в г1."
verify = "prometheus.yml содержит alerting: alertmanagers [alertmanager:9093]; на чистом стенде: stop 1 сервиса → firing-строка в alerts.jsonl (~2m: eval + group_wait 30s), start → resolved-строка (+group_interval при текущей конфигурации AM); e2e --blocks alerts --expect ... GREEN. Док-заметки (a)/(b) добавлены в res-01-acceptance.md/production-setup.md."
covers = ["R11"]
after = []
hitl = false
risk = "medium"
