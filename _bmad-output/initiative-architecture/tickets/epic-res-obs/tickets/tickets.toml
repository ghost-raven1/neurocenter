title = "BUG (RES-01 stage 2, FIXED env 2026-11-24): shared model-weights volume — first-mount ownership race (catalog uid 1000 vs ollama root) → fail-closed assertServiceVolumes crash loop"
description = "RES-01 stage 2 (2026-11-24, после фикса D5): catalog-service снова в crash loop, но уже НЕ DI — log: crash.unhandledRejection err:{name:\"Error\"} (message маскамируется epic-правилом, raw невидим). Raw-ошибка поймана одноразовым контейнером с ранним unhandledRejection-хуком (полный compose-env + secrets + volumes из compose config): Error: [catalog-service] владельцы writable-томов (AD-OP-6): каталог /data/models принадлежит uid=0, сервис работает от uid=1000 ... at assertServiceVolumes (shared/volume-ownership.cjs:54) at bootstrap (main.js). Root cause: том model-weights шарится на КОРНЕ двумя сервисами с разными uid — catalog-service (uid 1000, MODEL_STORAGE_PATH=/data/models, MODEL_HOSTING_ENABLED=true) и model-runtime/ollama (root, /root/.ollama; образ ollama НЕ содержит /root/.ollama — каталог создаётся рантаймом). Race первого mount на fresh-стеке: каталог-образ catalog /data/models = 755 1000:1000 (с подкаталогами models/, projects/), у ollama каталога в образе нет — whoever mounts first выигрывает owner корня; на стенде выиграл ollama → корень 755 root:root → assertServiceVolumes (fail-closed по дизайну, AD-OP-6/OQ-2, production-only) → crash loop, детерминированно неисправимо без внешнего chown. Доки покрывают только «старые root-owned тома (до non-root-миграции)», fresh-stack-гонку первого запуска не покрывают. Defect предшествует res-obs (model-weights sharing — модельный эпик + AD-OP-6). Фикс на стенде (санкционирован production-setup.md AD-OP-6: «одноразовый chown uid=1000 через привилегированный контейнер по явному решению»): chown 1000:1000 корня model-weights через scratch-контейнер (ollama root не затронут — root bypass DAC; assert проверяет только корень, не рекурсию; содержимое ollama id_ed25519 600 root:root / models/ осталось root-owned — catalog его не трогает). После: up -d --wait exit 0, все healthy. Фикс (требование для репо): (1) production-setup.md — операторский шаг провижининга владельства model-weights (chown 1000:1000 корня ДО первого up) — та же категория, что D6-пакет агента; (2) либо compose/design-гарантия: гарантировать первый mount catalog'ом (зависимость model-runtime от catalog-service не подходит — модель нужна catalog; реалистичный вариант — док-шаг). Примечание: GGUF-import-путь (catalog пишет в MODEL_STORAGE_PATH) при root-owned подкаталоге models/ (ollama) будет EACCES для uid 1000 — на стенде GGUF не грузятся (minimal profile, CPU-only), но дизайн-вопрос о subpath-разделении остаётся (в verify)."
