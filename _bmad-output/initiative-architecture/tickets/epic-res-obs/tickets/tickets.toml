title = "Sweep + RES-01: e2e-приёмка P0-RES (readiness)"
description = "Финальный проход эпика: (1) sweep: grep-инвентарь по правилам эпика (console.* в src; error.message в логах; quota-поля без enforcement; секции лимитов без точки; /health; сервисы вне scrape targets; root-контейнеры; сервисы без pids/user в модели; /ready без budgets из shared) — каждый hit: fix или явный exception; (2) RES-01 (HITL) на развёрнутом production-стеке по сценарию readiness P0-RES (S26): (а) лимиты — quota enforcement (запись сверх лимита → явный отказ, прежние данные целы), двухуровневые (смена policy применяется), hardening (живой стек: UID≠0, pids_limit — контролируемый fork-стресс: контейнер умирает, хост не затронут); (б) нагрузка — конкурирующие тяжёлые операции, рост WAL, нехватка диска → ранние 503/507 без повреждения + причина в UI/операторской диагностике; (в) scrape — 6/6 сервисов up=1 (включая ff:4400); (г) алерты — disk/queue/service/stale-backup условия → доставлено + снято; (д) логи — correlation id сквозной nginx→gateway→сервис, без ticket/error.message; (е) ошибки — crash сервиса → error_events + admin UI; (ж) аудит — admin-мутация → в единой истории (fail-тест green); (з) health — /ready семантика. Протокол + артефакты в tickets/epic-res-obs/. Закрытие readiness-критерия: «Применённые ограничения хранилища, проверка конкурирующих writers/WAL/заполнения и нагрузки; настоящий scrape и доставленные уведомления»."
verify = "Чеклист RES-01 (8 блоков) на live-стеке: все green, протокол с артефактами (логи/скриншоты/метрики); sweep: 0 необъявленных hits; readiness P0-RES строка: «Чего недостаёт» закрыто свидетельством; любой red = баг-тикет, не «потолерировать»."
