[[entry]]
id = 2
type = "story"
title = "linux-x64: полный 8-пунктный native-чеклист (точный кандидат)"
description = "Полная нативная приёмка точного кандидата 0.9.29 на текущем хосте (Astra Linux glibc 2.36 x86_64, X11, Node 24) — 8 отдельных случаев: (1) чистая установка без системных Node/npm, правильная архитектура, SHA/доверие, отказ повреждённого архива без замены программы; (2) регистрация существующего JSONC, комментарии/другие MCP сохранены, второй запуск не дублирует; (3) подключение через реальную площадку, выбор/отмена папки, Unicode/пробелы, запреты чужих каталогов, восстановление привязок после restart; (4) обновление с предыдущего архива — настройки/привязки/учётные данные сохранены, повтор идемпотентен; (5) сбой обновления/регистрации → восстановление согласованного локального комплекта, несовместимый downgrade отклонён; (6) мастер параметров MCP — секрет локально, корректная ревизия, отмена/ошибка не портят прежнее; (7) реальный stdio MCP + skill/plugin/remote-runtime по заявленному набору; (8) timeout/закрытие родителя/отмена/авария worker → все дочерние процессы завершены. Отчёт к точному архиву: native:true, OS security unchanged:true, журналы без секретов."
verify = "Отчёт linux-x64 к точному кандидату 0.9.29: 8/8 случаев passed, native:true, OS security unchanged:true, квитанции всех установок, данные не потеряны."
