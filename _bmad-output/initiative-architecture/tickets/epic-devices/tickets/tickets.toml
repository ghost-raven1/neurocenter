description = "Комплект проекта декларирует поддерживаемые версии opencode (поле каталога/манифеста — единый источник); мост определяет фактическую версию opencode на устройстве; версия вне диапазона — без тихой установки: явная ошибка + actionable следующий шаг (обновить до поддерживаемой / установить совместимую версию), NFR-3. Совместимая версия — установка без ошибки. Тесты: декларация в манифесте, определение фактической версии, mismatch-путь (отказ + сообщение со следующим шагом), compatible-путь."
