[[entry]]
id = 1
type = "story"
title = "FR-301: Агент — участник проекта (роль, контекст, инструменты, публичные чаты)"
description = "Сейчас есть базис: agent_catalog + immutable agent_catalog_versions + project_agents (migration 7), CRUD/assign/configure/remove/connect (agents.controller.ts, agents.service.ts, project-agent.repository.ts), compileAgentJob (agent-job-compiler.ts — model mapping) и PROJECT_AGENTS_JOB delivery на устройство (agent-jobs.ts); ProjectChatRunner (project-chat.runner.ts:54, durable FIFO, транспорты server + device-codex :161/:174, сводка :198); AgentToolsLoop (agent-tools.loop.ts:11, idempotent reserve:36/dispatch:47/complete:57, ≤3 steps :68, инструменты rag/publicChats/systemRoles). Gap FR-301: доказать и закрыть e2e «агент — полноценный участник»: у каждого агента роль, контекст = одобренные знания (FR-502), инструменты из каталога проекта (включая семантический поиск по 4 корпусам — потребляет epic-project entry 13/14, FR-311) и доступ к ПУБЛИЧНЫМ чатам проекта; два типа — server-агенты (системные роли, доверенная сторона) и device-агенты (через мост mcp-host, недоверенная сторона). Эта история не строит механизм чата (эпик 8), а сводит в e2e: несколько агентов (server + device) в одном публичном чате с ролью/контекстом/инструментами."
verify = "E2E: несколько агентов (server-агент системной роли + device-агент через mcp-host) в одном публичном чате проекта: каждый имеет роль, контекст = одобренные знания (learning context() — только approved, FR-502), инструменты из каталога проекта (тест: инструмент вне каталога проекта → недоступен); доступ к публичным чатам подтверждён (тест); device-агент работает через mcp-host (недоверенная сторона, билет) без деградации server-агента; корневой сьют — без деградации против baseline."
covers = ["R2", "R5"]
