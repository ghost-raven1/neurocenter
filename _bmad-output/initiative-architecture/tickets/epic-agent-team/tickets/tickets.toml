title = "FR-305: Отказоустойчивость background-агента (crash-политика, retry, идемпотентность)"
description = "Сейчас (по фактам main @ 56f8c009): (1) серверный lifecycle задания — agent-method-workflows/jobs.ts: agentMethodJobPayload:35 (immutable payload, версия метода фиксирована сервером :80, deadline 30min :84), assertAgentMethodJob:94 (recheck payload против ТЕКУЩЕЙ identity до claim и при каждом authorization-poll), assertAgentMethodResult:110 (succeeded/failed против исходной задачи/версии/проверок), assertAgentMethodCompletionAccess:126 (поздний успех не переживает отзыв доступа/смены привязки). (2) SEMANTICS recovery есть ТОЛЬКО для device-метод-воркфлоу (docs §«Отмена и восстановление»): результат записывается до ACK; потеря ACK → повторная доставка той же квитанции; после перезапуска найден только маркер начатого выполнения → состояние unknown, повторного исполнения нет; остановка после частичного изменения → read-only измерение (если привязка ещё действует); восстановление сохраняет уже записанные patch-факты и пройденные проверки. (3) референс идемпотентности: chat-discussion.runner.ts checkpoint:79 (request_id/lease :82-84), bounded:35, authority:58; epic-8 entry 12 (autonomous-rounds) — идемпотентность request_key/phase checkpoint, «шаг, уже потребивший бюджет, не повторяется после перезапуска» = КОНТРАКТ (ссылаемся, не дублируем). (4) observability: epic-6 entry 10 (AD-O5) — crash-политика + PG error-store (error_events) + API; entry 14 (AD-O7) — security_events/operations-аудит. Gap: crash/retry/idempotency СЕРВЕРНОГО background-агента (entry 7) не явны: нет crash-политики (retry с backoff / dead-letter / явная остановка), нет гарантии идемпотентности (повтор не дублирует эффекты: сообщения/артефакты/бюджет), crash не попадает в error-store + security/operations events. Эта история добавляет отказоустойчивость серверному фоновому агенту, переиспользуя device-семантику recovery + epic-8/epic-6 контракты."
verify = "Крах серверного background-агента во время работы (OOM/kill/рестарт контейнера) → применилась политика (retry с backoff / dead-letter / явная остановка) (тест: kill -9 mid-run → retry/backoff или dead-letter, не «молчаливая смерть» NFR-2); идемпотентность: повтор после краха НЕ дублирует эффекты (сообщения/артефакты/бюджет) — checkpoint request_key/phase, контракт epic-8 entry 12 (не дублируем) (тест: крах в середине шага → рестарт → нет дубля сообщений/артефактов, бюджет не списан дважды); crash попадает в error-store (epic-6 entry 10, AD-O5 error_events) + security/operations events (entry 14, AD-O7) (тест: crash → строка error_events + событие аудита); восстановление сохраняет уже записанные факты и пройденные проверки (паттерн docs §«Отмена и восстановление») (тест: partial → сохранённые patch-факты/проверки не потеряны); «захватить и жить дальше» запрещено (эпик 6 entry 10) — контролируемый exit + перезапуск docker-политикой; корневой сьют — без деградации."
covers = ["R5", "R8"]
after = [7, 10]
hitl = false
risk = "high"

