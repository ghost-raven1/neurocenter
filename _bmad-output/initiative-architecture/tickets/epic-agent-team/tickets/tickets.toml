description = "Сейчас: 5 системных ролей (system-role.definitions.ts:13 — agent-coordinator:15, agent-packager:36, agent-indexer:48, agent-ai-admin:59, agent-autoconfigurator:70), ROLE_BUDGET.coordinatorCalls=5 (:134/:136), roleCallBudget:147; system-role-mcp (system-role-mcp.controller.ts — execute/close, one-send admission, proof, state succeeded/unknown/failed); ProjectChatRunner-сводка (project-chat.runner.ts:198) — сейчас «после ≥2 агентов». Gap FR-303: (1) ПОКРЫТИЕ — системные роли покрывают вопросы самой системы: настройка (включая конфигурации на компьютере), диагностика, модели, мосты, навыки/плагины/MCP, агенты/ассеты, доступы, данные (включая RAG/quirk), очереди, обновление, восстановление; (2) координатор показывает владельца следующего действия (агент может вызвать системного агента и напрямую — FR-310/entry 5); (3) сводка — только после ответов нескольких уникальных агентов (сейчас ≥2 — уточнить до «нескольких УНИКАЛЬНЫХ»). Не перестраивать роли (базис есть), закрыть покрытие + координатор-владелец + семантику сводки."
verify = "Покрытие: каждый класс вопросов системы (настройка/конфиг на компьютере, диагностика, модели, мосты, навыки/плагины/MCP, агенты/ассеты, доступы, данные RAG/quirk, очереди, обновление, восстановление) → назначена ответственная системная роль (тест-матрица: вопрос → роль, без «никто не отвечает»); координатор показывает владельца следующего действия (тест); сводка — только после ответов нескольких УНИКАЛЬНЫХ агентов (тест: 1 агент / повтор того же → нет сводки; несколько уникальных → сводка); project-chat.runner.ts:198 семантика уточнена; корневой сьют — без деградации."
