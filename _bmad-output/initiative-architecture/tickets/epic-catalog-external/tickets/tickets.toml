[[entry]]
id = 1
type = "story"
title = "Системные ассеты: required-набор — обязательная установка на устройство + по умолчанию в проект"
description = "Явное выделение системных ассетов каталога (решение пользователя 2026-11-10: критерий = влияние на работоспособность системы и отдельных подсистем; анализ с основаниями в epic-md). Группы (12 ассетов): core — neurocenter-bridge; rag — mcp-opencode-rag, plugin-opencode-rag-plugin; system-roles — skill-neurocenter-project-context, skill-neurocenter-system-assistance, skill-neurocenter-project-learning, skill-neurocenter-packaging; agent-team — agent-planner/developer/reviewer/tester/documenter. РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ 2026-11-10: (а) системные ассеты = ОБЯЗАТЕЛЬНАЯ УСТАНОВКА НА КОМПЬЮТЕР (устройстве); (б) системные ассеты = ПО УМОЛЧАНИЮ В ПРОЕКТ; (в) МОДЕЛИ ВРЕМЕННО УБИРАЮТСЯ ИЗ ПОСТАВКИ: дефолтные модели ВСЕХ подсистем (чат, vision для изображений, embedding для RAG) и КЛЮЧИ ПРОВАЙДЕРОВ берутся из конфигурации opencode на компьютере (устройстве); модель-ассеты каталога (model-embedding-qwen3-4b, model-vision-qwen3-vl-2b и др.) остаются в каталоге как ВОЗМОЖНОСТЬ ХОСТИНГА (установка по желанию, механизм FR-601 сохраняется), но в required-набор и project-дефолт НЕ входят. Механика: поле в metadata-карточке (system: true, required: true, subsystem: 'core'|'rag'|'system-roles'|'agent-team', note с основанием) — распространяется в index/manifest (prepare.mjs) и в API каталога (catalog-service: карточка + список). (а) Устройство: onboarding/реконсилиация устройства = автоназначение+установка required-набора (без ручных шагов); readiness-гейт устройства: отсутствие системного ассета = явное состояние «не готов» (не тихая деградация) — устройство не проходит приёмку, пока required-набор не установлен. (б) Проект: создание проекта (в т.ч. из шаблона, FR-102) = required-набор автоматически входит в назначения проекта; снятие системного ассета из проекта НЕ доступно (в UI кнопки удаления нет; API-вызов = явная ошибка с причиной). (в) Резолвинг моделей/ключей: подсистемы (RAG-embedding, chat-vision, see-image) читают дефолтную модель и ключи провайдеров из локального opencode-конфига устройства (opencode.json + auth-хранилище opencode); если в конфиге opencode нет нужной модели/ключей — предлагать заполнить (явный онбординг-шаг с указанием, что именно добавить в конфиг; решение пользователя 2026-11-10); тихий fallback на каталог отсутствует. UI каталога: отдельная группа «Системные (обязательные)» + badge с подсистемой; модель-ассеты — в обычной группе с пометкой «хостинг (опционально)». Внутренние системные агенты (agent-coordinator/packager/indexer/ai-admin/autoconfigurator) не трогать — они вне каталога."
verify = "12 карточек несут system+required+subsystem+note (тест по описи из epic-md); index/manifest содержат поля (prepare.mjs + pin-тест); API отдаёт метку (тест на каждый kind группы); UI: группа «Системные (обязательные)» + badge, снятие недоступно (e2e/скриншот-проверка); onboarding устройства без required-набора = явное «не готов» (тест); создание проекта = required-набор в назначениях автоматически (тест); снятие системного ассета через API = явная ошибка с основанием (тест); модель-ассеты в required-набор и project-дефолт НЕ входят (тест), возможность установки из каталога (хостинг) сохранена (тест); подсистемы резолвят дефолтные модели + ключи провайдеров из opencode-конфига устройства (тест); отсутствие конфигов opencode = предложение заполнить (тест); пользовательские ассеты метку не несут и в проект НЕ подставляются; корневой сьют без деградации."
covers = ["R12"]
after = []
hitl = false
risk = "medium"

