[[entry]]
id = 10
type = "story"
title = "Backup lock: TTL + auto-release по heartbeat (AD-D3)"
description = "AD-D3: файловый бэкап-лок (backup-storage.ts:7 BACKUP_LOCK, :38-67 acquire) после крэша бэкап-процесса живёт вечно — снимается оператором офлайн (реcovery.mjs:354). (1) лок = dir + owner + heartbeat-файл (ts); (2) acquirer: lock старше TTL и heartbeat не свежий → replace (crash-safe: бэкап = один джоб, TTL > max backup duration); (3) fresh lock → отказ. OQ: значение TTL (рекомендация 30min)."
verify = "Старый лок (heartbeat старше TTL) → acquire успешно, предыдущий owner замечен (security event/log); свежий лок (heartbeat < TTL) → acquire отказ; kill -9 бэкап-процесса → следующий бэкап стартует после TTL без офлайн-вмешательства."
covers = ["R9"]
after = []
hitl = false
risk = "medium"

