[[entry]]
id = 1
type = "story"
title = "Quota-модель: per-project used-bytes accounting + schema + API (AD-D4)"
description = "AD-D4: projects.quota — единый source-of-truth «что считается / сколько занято / что удалится». (1) schema: quota JSONB на projects с 6 полями (current/retention/staging × limit/used), limit=0 ⇒ unlimited — семантика уже есть в project-validation.ts:23-79, замораживается; (2) персистентный per-project used-bytes accounting (механизм AD-D4): новая таблица project_quota_usage (миграция v53, max=52) + единая точка записи — internal API POST /internal/projects/:id/quota-usage {dimension, deltaBytes, request_key} (idempotency — AD-D5 pattern 4); (3) writers подключаются через accounting API: RAG-записи (rag-sync), skills-записи (skills-service), artifact-cache (story 2); (4) quota API (POST /projects, GET, PATCH /projects/:id/quotas) возвращает limit (projects.quota) + фактический used (таблица). Enforcement НЕ здесь — enforcement-точки (сравнение с лимитом до записи) — epic-res-obs (эпик 6)."
verify = "RAG-запись 50МБ → GET quota: used = 50МБ (± Δ); replay того же request_key → без дубля; пустой проект → нули; limit=0 → unlimited сохранено; дельты конкурентные → сумма алгебра; удаление проекта → accounting-строки каскадом (FK); запись без accounting-вызова → fail-тест (обход)."
covers = ["R9"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Artifact cache gateway: персистентный volume + LRU + per-project квота (AD-D2)"
description = "AD-D2: cache MCP-artifacts сейчас в tmpdir (artifact-cache.ts:14-15, env NEUROCENTER_MCP_HOST_DIR не задан в compose) — не персистентен, без квоты, без eviction. (1) новый volume artifact-cache + env в compose.production.yml и environment-model.json (env-локация — часть config-схемы gateway по AD-D2); (2) LRU-эвиктор по oldest-access (механизм AD-D2): при записи (build) проект, чей used-bytes (accounting story 1, измерение current) > limit → удалять .ready-файлы проекта с самым старым доступом до лимита; last-access записывается в sidecar-мап (atime ФС не используется — noatime); кэш content-addressed → эвикция безопасна (файл детерминированно достроится); (3) global cap — OQ. Паттерн записи (tmp+rename+fsync) уже в code (AD-D5 pattern 1), не трогается."
verify = "После рестарта gateway кэш жив (volume персистентен); запись сверх per-project лимита эвикционирует файлы с самым старым доступом; один и тот же контент → один и тот же путь (content-addressed); materialize присутствующего файла обновляет last-access и влияет на порядок eviction; materialize отсутствующего — тот же ответ, что сейчас (без regression)."
covers = ["R3"]
after = [1]
hitl = false
risk = "high"

