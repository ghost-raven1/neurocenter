description = "AD-D5: 4 канонических паттерна уже ратифицированы в code: (1) tmp+rename+fsync — runtime-artifacts.ts:61-129; (2) 2-phase + recover-таблица — snapshot-storage.ts:293-335, blob_writes recover :436-445; (3) lease-токены с recheck — gguf advisory lock :141-143, job-lease headers, verifier 2-min lease; (4) unique + row-lock idempotency — device-job-requests.ts:23-61 (ON CONFLICT DO NOTHING). (1) Таблица «операция → паттерн» как единый источник (документ, OQ: где); (2) forwardRuntimeArtifact (device.controller.ts:236-254 → runtime-artifact-stream.ts:7-60): сейчас только length-check 256MiB, SHA нет — добавить SHA-256: sender считает при стриме → header + строка bridge_runtime_artifacts (migration), receiver верифицирует, mismatch → ошибка + security event; (3) invariant: новые записи в shared volumes только через 4 паттерна."
