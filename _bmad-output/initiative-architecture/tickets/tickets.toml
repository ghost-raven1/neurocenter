# Эпики инициативы. Порядок таблиц = порядок сборки.
# next_id = 12

[[epic]]
id = 1
slug = "epic-release-baseline"
title = "Релиз и supply-базис"
description = "Релиз собирается воспроизводимо с чистого git-checkout: supply-манифест (digest'ы, опись bridge-dist, commit SHA) и связка source↔version↔digest↔descriptor↔SHA (REL-01); compose сверяется drift-тестом, production не стартует с dev-обходами (AD-OP-1/5); дефект bridge-endpoints 404 закрыт; shared-слой разделён с drift/freshness-гардами (AD-7/8/10); поставка закрыта: локальный registry, запрет отключённого TLS (AD-15); версионирование схемы едино (AD-D1) — базис для всей data-работы."
covers = ["R1"]

[[epic]]
id = 2
slug = "epic-trust-device-catalog"
title = "Устройственный канал и версии каталога"
description = "mcp-host жив в production (route shadowing закрыт, AD-14); билет верифицируется (HMAC + claims + ceiling, AD-3) и отзывается в окне TTL кэша (AD-4); retire версии необратим с записью в аудит (AD-16); у gateway — таблица роут-политики и error-body-политика (AD-6/AD-19); контрактная версия и ceiling — единый источник (AD-2/AD-12/AD-13). Публикация каталога (UJ-2): упаковка из доверенных источников с SHA-описью (FR-201), провенанс артефакта — версия/SHA/источник/время/издатель, проверяется из карточки (FR-203), immutable-версии и назначение только одобренного комплекта (FR-202). Артефакты — живой mcp-host, верифицированные билеты, версии каталога: базис для установщиков устройств (эпик 7) и агент-команды (эпик 9)."
covers = ["R9", "R12"]
after = [{ epic = 1, needs = "сплит shared-слоя (AD-7) и release pipeline" }]

[[epic]]
id = 4
slug = "epic-dr"
title = "DR: cross-host restore (P0-S3/MNT/UPD, C3)"
description = "P0-S3/P0-MNT/P0-UPD закрыты: quiesced backup по расписанию на независимый S3 с readback-верификацией; maintenance-таймер реален (успешный слот + отказ + повтор, измеренные пауза/RPO/RTO); модуль обслуживания: feature flags, журнал операций, capacity, статус бэкапов (FR-1001); репетиция обновления на копии рабочего объёма с точными актуальными образами; полный cross-host restore без исходных дисков (репетиция на стеке, каком он существует на момент эпика); RPO/RTO измерены и задокументированы (UJ-5). DR-бандл (AD-OP-4) собирается из текущего compose; новые compose-сервисы (prometheus/alertmanager — эпик 6) подхватываются на повторном финальном restore при приёмке пилота (эпик 10)."
covers = ["R1", "R3", "R10", "R12"]
after = [{ epic = 1, needs = "supply-манифест (AD-OP-2) и compose-as-data (AD-OP-1)" }]

[[epic]]
id = 5
slug = "epic-data"
title = "Данные проекта: согласованная модель"
description = "Один write-owner на volume (AD-D2: model-weights — только через API inference-runtime, artifact-cache — persistent volume + LRU + per-project квота); retention — единая таблица, ~12 unbounded-таблиц → TTL, удаление проекта = полный каскад с квитанцией (AD-D3); quota-поля: модель и схема, удаление из API того, что не enforce'ится (AD-D4) — enforcement-точки сдаёт эпик 6 (P0-RES); crash consistency — 4 канонических паттерна (AD-D5); данные проекта (PG, per-project RAG-БД, model-weights, artifact-cache) входят в DR-бандл эпика 4 — write-owner и crash consistency гарантируют согласованность восстановленного состояния (часть R3). Версионирование схемы — базис из эпика 1 (AD-D1)."
covers = ["R3", "R9", "R11"]
after = [{ epic = 1, needs = "единое версионирование схемы (AD-D1)" }]

[[epic]]
id = 6
slug = "epic-res-obs"
title = "Ресурсы и наблюдаемость (P0-RES)"
description = "P0-RES закрыт: двухуровневые лимиты (ceiling-константы + policy в DB) исполняются в enforcement-точках, включая enforcement-точки quota-полей projects.quota (AD-D4, квотная модель — из эпика 5; AD-1/9/11/12/18); hardening: non-root, pids_limit, ресурсная таблица (AD-OP-6); единая лог-схема с correlation id и redaction (AD-O1/2/8); канонический набор метрик с completeness-тестом (AD-O3); health /ready (AD-O4); error visibility: PG error_events + admin UI (AD-O5); prometheus/alertmanager — compose-сервисы, базовые алерты и доставляющий канал (AD-O6); транзакционный аудит admin-мутаций (FR-903) и security_events для device/session/gateway-событий (AD-O7) — аудит-часть R9; новые compose-сервисы подхватываются в DR-бандл эпика 4 (AD-OP-4) на финальном restore."
covers = ["R1", "R7", "R9", "R10", "R11"]
after = [{ epic = 1, needs = "единое версионирование схемы (AD-D1) и compose-as-data" }, { epic = 5, needs = "квотная модель (AD-D4): поля и схема квот" }]

[[epic]]
id = 7
slug = "epic-devices"
title = "Матрица установщиков (P0-NAT)"
description = "P0-NAT закрыт: установщики всех 8 клиентских целей (7 оставшихся) и полный чеклист для всех 8 (папки/настройки/восстановление/дочерние); устройство — личный opencode-агент пользователя, «одетый» проектом (FR-701), каждая установка — с квитанцией (FR-702); устройство работает offline (кэш) и переподключается без потери данных (FR-704); комплект декларирует поддерживаемые версии opencode, несовместимость — явная ошибка + следующий шаг (FR-706). UJ-3 работает как записан."
covers = ["R1", "R2", "R12"]
after = [{ epic = 1, needs = "кандидат релиза (установщики строятся из кандидата)" }, { epic = 2, needs = "живой mcp-host и верифицированные билеты (AD-3/AD-14)" }]

[[epic]]
id = 8
slug = "epic-project"
title = "Проект как единица: шаблон, знания, модели, чат (C4)"
description = "Ядро сценария доступно без чтения документации (R6): проект создаётся из шаблона: предзаполненный каталог, знания, роли (FR-102); lifecycle проекта и защищённый RAG-purge (FR-103), snapshot/restore/rollback (FR-104); цикл знаний: опыт → гипотезы → проверка → кандидат → одобрение (FR-501..503) и точечный перенос опыта между проектами с провенансом (FR-504); проектный model set: capability — открытое множество (FR-608), личные ключи моделей (FR-603), in-use guard (FR-604), импорт весов вручную (GGUF/архив, SHA, prepare/activate — FR-601), lifecycle модели (FR-602), enforced model budget (FR-605), проектная embedding-модель + reindex/sync (FR-606); контекст-окно и системный промпт (FR-607) — [P2], решение при планировании эпика; чат: режимы диалога и автономные раунды (FR-401), публичные/приватные комнаты (FR-402), приватность от главного админа (FR-403), вложения с лимитами (FR-404); семантический поиск агентов по четырём корпусам — актуальный код, публичные чаты, одобренные знания, опыт (FR-311; sync индекса — FR-606). Включает спайк: colibri как второй inference-бэкенд для frontier MoE (Q9). Проектный чат — базис для агент-команды (эпик 9)."
covers = ["R4", "R6", "R9", "R12"]
after = [{ epic = 2, needs = "каталог: одобренные комплекты и версии (FR-202, AD-16)" }, { epic = 5, needs = "per-project data-модель: RAG-БД, retention, квоты (AD-D3/D4)" }]

[[epic]]
id = 9
slug = "epic-agent-team"
title = "Агент-команда end-to-end (C5)"
description = "Агент — участник проекта: роль, контекст, инструменты, публичные чаты (FR-301), системные роли (FR-303), проверяемый результат — верификация, а не «сделано» (FR-304). Реальный проект проведён агент-командой через BMAD → OpenSpec в основном рантайме (FR-308, закреплённые версии): фоновый агент в opencode-среде (FR-305), расширения только из каталога (FR-306), onboarding агента без оператора (FR-307), последовательный контекст и подключение агента агентом (FR-302), деление контекста с агентами/пользователем/командой (FR-309), вызов системного агента при проблеме/уточнении (FR-310); агенты работают в проектном чате эпика 8 (режимы FR-401, комнаты)."
covers = ["R2", "R5", "R8"]
after = [{ epic = 2, needs = "устройственный канал (агенты работают через mcp-host)" }, { epic = 8, needs = "проектный чат с режимами и комнатами (FR-401..404)" }]

[[epic]]
id = 11
slug = "local-auth"
title = "Локальный auth как supported-конфигурация (AD-OP-5)"
description = "Пилот идёт на production-стеке с локальным auth (локальный Blitz-совместимый IdP в закрытом контуре; решение пользователя 2026-11-06: центральный Blitz — после пилота, эпик 3). Решение coverage-аудита G-6 (2026-11-09): локальный auth = first-class supported-конфигурация production-конфига, не dev-обход (AD-OP-5, ep1 entry 1.4): поддерживаемые режимы (local-idp / corporate — центральный Blitz) декларированы в production-модели + drift-тест-проверка; операторские доки (production-setup.md: секция «Локальный IdP-режим (пилот, interim)» + P0-SSO-строка в readiness); e2e на production-стеке в local-auth-режиме: логин (PKCE)/сессия/bridge-билет, первый админ без dev-входа, 0 dev-флагов в production-конфиге, evidence authMode=local-idp. Инварианты ep1 e4 не сломаны (compose-drift с productionEnvConstraints, production-runtime: SSO_DISABLE=true → отказ старта). Блокирует пилот (эпик 10)."
covers = ["R1", "R2", "R12"]
after = [{ epic = 1, needs = "production-конфиг без dev-обходов (AD-OP-5, entry 1.4): productionEnvConstraints-матрица + механизм validateProduction" }]

[[epic]]
id = 10
slug = "epic-pilot"
title = "Пилот: приёмка и GO"
description = "Приёмка пилота на ЛОКАЛЬНОЙ версии (решение пользователя 2026-11-06: Blitz IdP — после пилота, эпик 3 в конце очереди; вход — существующий локальный auth-режим как interim-конфигурация): 5 P0-блокеров (P0-S3/MNT/UPD, P0-RES, P0-NAT; P0-S3 ре-верифицирован финальным cross-host restore на полном стеке, включая сервисы эпика 6) + 5 приоритетных сквозных проверок пройдены (NO-GO → GO); baseline Q7 зафиксирован (время onboarding, балл опроса, число шагов, рост); опрос удобства Q3 (5-pt + лог тупиков) проведён на пилотной команде; решение о выходе на фазу 2 (включая переход на Blitz IdP — эпик 3)."
covers = ["R1", "R2", "R5", "R6", "R12"]
after = [{ epic = 4, needs = "P0-S3/MNT/UPD и RPO/RTO" }, { epic = 6, needs = "P0-RES" }, { epic = 7, needs = "P0-NAT" }, { epic = 8, needs = "проекты из шаблона (C4)" }, { epic = 9, needs = "реальный проект агент-командой (C5)" }, { epic = 11, needs = "локальный auth = supported-конфигурация (AD-OP-5, G-6): режимы в модели, операторские доки, e2e на production-стеке" }]

[[epic]]
id = 3
slug = "epic-identity"
title = "Вход: настоящий Blitz IdP (P0-SSO)"
description = "P0-SSO закрыт: вход/отказы/истечение/выход на настоящем Blitz (единственный IdP контракта), первый админ, отзыв прав без re-login, отказ production-старта при dev-auth; неверный state/отказ IdP не создают сессию (fail-closed, FR-901); человек добавляется главным админом по почте (FR-902) — человеческая часть R2 (onboarding без оператора). UJ-1 работает как записан. Решение пользователя 2026-11-06: эпик перенесён в конец очереди сборки (после пилота) — пилот идёт на локальной версии. Открытый вопрос (решить до пилота): локальный auth-режим пилота должен быть поддержанной конфигурацией, а не dev-обходом (AD-OP-5 запрещает их в production-конфиге, entry 1.4) — если это отдельная работа до пилота, выносится в отдельный микро-эпик (решение с пользователем); Blitz-часть эпика строится после GO."
covers = ["R1", "R2", "R12"]
after = [{ epic = 1, needs = "кандидат REL-01 (замороженный релиз)" }, { epic = 10, needs = "пилот: локальная версия принята (GO) — решение пользователя 2026-11-06: SSO после пилота" }]
