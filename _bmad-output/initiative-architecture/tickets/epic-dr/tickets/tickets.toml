[[entry]]
id = 8
type = "story"
title = "Stack-watchdog (AD-OP-8) + node_exporter: consumer /ready/dependencies"
description = "AD-OP-8: на хосте — stack-watchdog (новый systemd unit: периодическая проверка health всех compose-сервисов + самого мониторинга; сбой = алерт + attempt-restart по политике compose) + node_exporter (host-level-метрики). Сегодня: только maintenance timer (deploy/maintenance/ — ратификация), watchdog/node_exporter отсутствуют; /ready/dependencies (gateway app.controller.ts:15-32, 5 upstream'ов) существует, и контракт ep6 entry 9 (health): stack-watchdog (AD-OP-8, эпик 4) = consumer, «удалить, если к концу эпика 4 не подключён» — этот entry = тот consumer (закрывает решение). (1) watchdog: scripts/production/stack-watchdog.mjs + unit'ы neurocenter-stack-watchdog.{service,timer} (User=neurocenter-operator, OnCalendar ~5 min, паттерн neurocenter-maintenance.timer): список сервисов = environment-model.json (data-driven — новые сервисы подхватываются автоматически: на момент эпика 13, после ep6 entry 12 = 15); проверка /ready на каждый сервис + /ready/dependencies (gateway) + мониторинг (prometheus/alertmanager — после ep6 entry 12, до — absent-tolerant); сбой → алерт (alertmanager ep6 entry 13, если развёрнут; до — journal + файл, паттерн delivery ep6 e13) + attempt-restart по политике compose (docker compose restart <svc>, ограниченный по числу попыток, без infinite-loop); (2) node_exporter: compose.production.yml сервис (12→13; целевой состав после ep6 entry 12 = 15 — sync с ep6-планом, OQ-1): prom/node-exporter pinned, backend-сеть, порты наружу НЕ публикуются, read-only-маунты хоста (/proc:/sys:ro, /:ro), mem/cpus/pids, environment-model + drift-тест (13) + release-manifest (AD-OP-2, паттерн postgresImage/monitoringImages) + scrape-target (prometheus.yml — доносит ep6 entry 8/12)."
verify = "watchdog: упавший сервис → детект в пределах интервала + действие (attempt-restart по политике ИЛИ алерт) — fixture-тест логики офлайн (без живого стека); /ready/dependencies consumer (контракт ep6 entry 9 закрыт: «удалить, если к концу эпика 4 не подключён» = подключён); список сервисов из environment-model (data-driven, 13 на момент entry); unit'ы синтаксически валидны (systemd-analyze verify) + установка по runbook-паттерну maintenance timer; node_exporter: compose production 13 сервисов, drift-тест зелёный (structuralDrift + compose-drift счёт), 9100 не опубликован наружу, metrics scrape-ятся (офлайн-тест конфигурации); compose healthchecks — без регрессии; корневой сьют — без деградации."
