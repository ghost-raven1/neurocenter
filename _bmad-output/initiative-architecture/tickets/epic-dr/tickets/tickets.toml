[[entry]]
id = 7
type = "story"
title = "Rotation-секретов + edge-сертификата: runbook на каждый секрет + запись последствий + алерт (FR-1004, AD-OP-4, AD-OP-7.3)"
description = "FR-1004/AD-OP-4: «Секреты ротируемы с задокументированными последствиями» — runbook ротации сегодня без владельца (генерация закрыта: configuration.mjs:210-211 postgres_password/internal_token, :145-182 metrics_token, :230-233 sso_client_secret, :213 model_credential_key; «автоматической ротации нет» — production-update.md:83). Runbook в docs/ на каждый секрет инвентаря (сверить с environment-model.json + compose.production.yml:318-328): internal_token, metrics_token, sso_client_secret, model_credential_key, postgres_password + edge-сертификат (nginx /run/secrets/tls_cert, AD-OP-7.3). На каждый: (1) процедура ротации (пошагово, из текущего production-конфига; postgres_password — с обновлением 4 файлов *_url), (2) запись последствий (что ломается при истечении/ротации: internal_token → гашение всех билетов, стык AD-4; metrics_token → падает scrape; sso_client_secret → token-exchange с IdP; model_credential_key → зашифрованные credentials удалённых моделей не открываются; postgres_password → все PG-соединения; edge-сертификат → HTTPS edge-фронта), (3) как проверить истечение (openssl x509 -checkend для сертификата; для секретов — days-since-генерации по config-каталогу + policy-период ротации). Алерт days-to-expiry edge-сертификата — consumer ep6 entry 13 (alerting, правило cert-expiry AD-OP-7/OP-8) — ссылка в runbook, не дублирование. Инвариант: runbook покрывает 100% инвентаря (тест)."
verify = "docs/secret-rotation.md существует: секция на каждый из 5 секретов + edge-сертификат, в каждой: процедура ротации + запись последствий + как проверить истечение; инвентарь runbook ⊇ 5 секретов AD-OP-4 + edge-сертификат, дополнительные секреты compose/environment-model (restore_runner_token, chat_s3_*, *_url) — решение зафиксировано (включены или явно исключены с причиной); алерт days-to-expiry — ссылка на ep6 entry 13 (cert-expiry) без дублирования механизма; инвариант-тест: секрет/сертификат из инвентаря без секции в runbook = фэйл; корневой сьют — без деградации."
