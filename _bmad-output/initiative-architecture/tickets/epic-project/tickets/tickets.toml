[[entry]]
id = 17
type = "story"
title = "AD-11: Capability-advisor UI — machine-aware пресеты лимитов"
description = "AD-11 (architecture-runtime-trust.md:105-109): админ, настраивая runtime-limits, подбирает значения вручную без связи с реальной машиной. AD-11: одна из системных ролей предлагает в UI machine-aware пресеты лимитов, вычисленные из фактических ресурсов хоста (disk/RAM/CPU); все пресеты внутри ceiling; рекомендация advisory — решение за администратором. Вход: capacity-snapshot — disk уже собирается (shared/capacity.cjs:4 6 ресурсов, :29-57 validateSnapshot schemaVersion 1, :203-222 getCapacityStatus) + machine-метрики RAM/CPU — AD-18 (закрыт эпик 6 entry 8: collector /proc/meminfo+/proc/stat → поле machine в snapshot, validateSnapshot backward-совместимый, старые снапшоты валидны). Целевой набор пресетов — storage/machine-секции AD-1 (runtime-cache, rag-quota, snapshot/backup, gguf-disk); ceiling = shared/runtime-limits.cjs RUNTIME_LIMIT_CEILINGS (сейчас textKnowledge+ggufImport — :4-5); admin-UI = frontend/src/features/RuntimeLimits (Settings.tsx:12, RuntimeLimitsSettings.tsx:9, fields.ts:7-33). Эта история: (1) advisor-расчёт в catalog (системная роль): GET advisor — читает актуальный capacity-snapshot + machine-поле, на каждую целевую секцию считает пресеты (3 уровня, каждый в [default..ceiling]) с обоснованием из фактических значений (disk freeBytes минус reserveBytes :7, RAM free/total, CPU count/load) и observedAt/age; (2) UI: advisor-блок в RuntimeLimitsSettings на секцию — пресеты как рекомендации + «Применить» через СУЩЕСТВУЮЩИЙ PATCH /api/runtime-limits/admin intent-flow (receipt, без обхода) + disclaimer advisory; (3) деградация (AD-18): нет machine-поля (снапшот до AD-18) → disk-only пресеты; снапшот недоступен/stale (>90s) или CAPACITY_REQUIRED не задан → advisor скрыт с причиной, секции остаются редактируемы. Стык entry 1 (open capability set, after): gguf-disk-пресет учитывает capability/назначение модели."
verify = "GET advisor: пресеты по целевым секциям, каждое значение в [default..ceiling] (тест по секции); пресеты зависят от фактических значений снапшота (тесты-фикстуры: disk/RAM/CPU → разные значения); снапшот без machine → disk-only пресеты + флаг «RAM/CPU недоступны» (деградация AD-18, тест); CAPACITY_REQUIRED не задан / снапшот stale → advisor не рендерится, причина зафиксирована (test); UI: advisor-блок рендерится в RuntimeLimitsSettings, «Применить» = существующий PATCH intent → receipt (тест e2e-frontend); админ может изменить предложенное значение (advisory, тест); корневой сьют — без деградации."
