# Local S3 implementation for development; production points CHAT_S3_ENDPOINT at Ceph RGW.
services:
  chat-storage:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: [server, /data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${CHAT_DEV_S3_PORT:-19010}:9000"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/chat_s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/chat_s3_secret_key
    secrets: [chat_s3_access_key, chat_s3_secret_key]
    volumes: [chat-files:/data]
volumes:
  chat-files:
secrets:
  chat_s3_access_key:
    file: ${CHAT_DEV_S3_ACCESS_KEY_FILE:?Run dev.sh up to prepare private local credentials}
  chat_s3_secret_key:
    file: ${CHAT_DEV_S3_SECRET_KEY_FILE:?Run dev.sh up to prepare private local credentials}
