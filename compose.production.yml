# Отдельный стек: не объединять с dev docker-compose.yml и его env_file.
# Состав осознанный (паттерн D2): dev-стек — 10 сервисов, production — 16.
# Мониторинг (prometheus, alertmanager, node_exporter) — только production: dev-стек без
# prometheus/alertmanager (OQ-1 — рекомендация: мониторинг принимается на production-стеке).
# Production = dev 10 + capacity-collector, database-init (one-shot), bootstrap-admin (one-shot),
# node_exporter (host-метрики, AD-OP-8), prometheus + alertmanager (AD-O6, ep6 entry 12).
# Публичных портов у мониторинга нет: scrape из backend-сети через metrics_token (/run/secrets).
x-service: &service
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  security_opt: [no-new-privileges:true]
  # AD-OP-6 (entry 2): pids-базовая линия для всех сервисов якоря — Node-сервис держит 1-3 PID,
  # 256 — запас против форк-бомбы с рабочим запасом по процессам (OQ-1). Пер-сервисный override —
  # только осознанное отклонение (512/32/128/64/128-setup + мониторинг).
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  networks: [backend]

x-runtime: &runtime
  NODE_ENV: production
  BIND_HOST: 0.0.0.0
  PANEL_URL: ${PANEL_URL:?Заполните PANEL_URL}
  NEUROCENTER_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
  NEUROCENTER_METRICS_TOKEN_FILE: /run/secrets/metrics_token
  # Внутренняя топология стека никогда не идёт через прокси: axios (proxy-from-env) уважает
  # HTTP(S)_PROXY окружения, и при его присутствии межсервисные вызовы уходили бы на внешний
  # прокси, не знающий docker-имён (502 → 503 у клиентов).
  NO_PROXY: localhost,127.0.0.1,::1,0.0.0.0,postgres,catalog-service,api-gateway,skills-service,rag-sync-service,feature-flags-service,oauth2-bridge,model-runtime,frontend,background-agent,blitz-fixture,blitz.test,panel.test
  # lowercase обязателен: axios (proxy-from-env) и Go net/http читают no_proxy ПЕРВЫМ,
  # а Docker-демон инжектит свой короткий no_proxy — без явного значения compose он
  # заслонял бы NO_PROXY и внутренние вызовы уходили бы в прокси (502 → 503).
  no_proxy: localhost,127.0.0.1,::1,0.0.0.0,postgres,catalog-service,api-gateway,skills-service,rag-sync-service,feature-flags-service,oauth2-bridge,model-runtime,frontend,background-agent,blitz-fixture,blitz.test,panel.test

services:
  # Runtime starts empty; model installation uses imported asset supply.
  model-runtime:
    <<: *service
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    mem_limit: 5g
    cpus: 4
    pids_limit: 512
    # AD-OP-6 (entry 2): явный user — образ ollama работает root'ом (выбор образа, вне non-root-скоупа 6.1);
    # 0 — ратификация фактического uid (external-note в модели).
    user: 0
    cap_drop: [ALL]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # CLI dial'ит 0.0.0.0:11434 — без 0.0.0.0 в no_proxy запросы идут через HTTP(S)_PROXY (если окружение
      # их инжектит) и healthcheck `ollama list` падает на 502 proxy'ем.
      NO_PROXY: localhost,127.0.0.1,::1,0.0.0.0
      no_proxy: localhost,127.0.0.1,::1,0.0.0.0
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_CONTEXT_LENGTH: ${MODEL_CHAT_CONTEXT_WINDOW_TOKENS:-4096}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '8'
      OLLAMA_KEEP_ALIVE: 5m
    volumes: [model-weights:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    <<: *service
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    mem_limit: 1g
    cpus: 2
    # AD-OP-6 (entry 2): entrypoint образа запускает процесс от postgres (uid 999) — явный user
    # ратифицирует дефолт внешнего образа (вне non-root-скоупа 6.1). Проверено: initdb на пустом томе
    # и рестарт на существующем — работают под --user postgres.
    user: postgres
    environment:
      POSTGRES_USER: nc_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nc_owner -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  capacity-collector:
    image: neurocenter/catalog-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    # AD-OP-6 (entry 2): тот же catalog-образ, что у app-сервисов — user 1000 (6.1).
    user: 1000
    command: [node, /repo/services/shared/capacity-collector.cjs]
    volumes:
      - postgres:/volumes/postgres:ro
      - skills:/volumes/skills:ro
      - projects:/volumes/projects:ro
      - backups:/volumes/backups:ro
      - runtime-artifacts:/volumes/runtime-artifacts:ro
      - model-weights:/volumes/model-weights:ro
      - capacity:/capacity
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /repo/services/shared/capacity-collector.cjs, --check]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  database-init:
    <<: *service
    image: neurocenter/catalog-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/catalog-service/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    restart: 'no'
    profiles: [setup]
    # AD-OP-6 (entry 2): setup-контейнер получает mem/pids-лимиты (один catalog-образ, user 1000);
    # long-running-инвариант на one-shot не распространяется (зафиксировано в invariant-тесте).
    user: 1000
    mem_limit: 512m
    pids_limit: 128
    command: [node, dist/database/production-init.cli.js]
    secrets: [postgres_password, catalog_url, rag_url, rag_provision_url, backup_url]
    depends_on:
      postgres: {condition: service_healthy}

  bootstrap-admin:
    <<: *service
    image: neurocenter/catalog-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    restart: 'no'
    profiles: [setup]
    # AD-OP-6 (entry 2): setup-контейнер получает mem/pids-лимиты (один catalog-образ, user 1000);
    # long-running-инвариант на one-shot не распространяется (зафиксировано в invariant-тесте).
    user: 1000
    mem_limit: 512m
    pids_limit: 128
    command: [node, dist/access/bootstrap-admin.cli.js]
    environment:
      NODE_ENV: production
      NEUROCENTER_SERVICE: bootstrap-admin
      SSO_DISABLE: 'false'
      CATALOG_PG_URL_FILE: /run/secrets/catalog_url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Заполните почту первого администратора}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Главный администратор}
    secrets: [catalog_url]
    depends_on:
      postgres: {condition: service_healthy}

  # Фоновый агент (FR-305): фоновое opencode-исполнение задач (не блокирует чат). Движок —
  # bin/opencode-probe из автономного пакета в named-volume background-agent-runtime (ro, OQ-2);
  # без пакета healthcheck (--check) не проходит — явная ошибка предусловия. 1 replica (OQ-1),
  # изоляция mem/cpus/pids (OQ-4).
  background-agent:
    <<: *service
    image: neurocenter/catalog-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    command: [node, dist/background-agent/background-agent.cli.js]
    environment:
      NODE_ENV: production
      NEUROCENTER_SERVICE: background-agent
      PANEL_URL: ${PANEL_URL:?Заполните PANEL_URL}
      NEUROCENTER_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      CATALOG_PG_URL_FILE: /run/secrets/catalog_url
      BACKGROUND_AGENT_RUNTIME_ROOT: /app/background-agent-runtime
    secrets: [internal_token, catalog_url]
    volumes: [projects:/data/projects, background-agent-runtime:/app/background-agent-runtime:ro]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/background-agent/background-agent.cli.js, --check]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s

  catalog-service:
    <<: *service
    # bwrap owns nested PID/network namespaces; no host administrative capabilities are granted.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp/catalog-packager.json
    image: neurocenter/catalog-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/catalog-service/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 512m
    cpus: 1
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      <<: *runtime
      CAPACITY_REQUIRED: 'true'
      PORT: 4100
      CATALOG_PG_URL_FILE: /run/secrets/catalog_url
      # Эта роль читает только RAG; рабочий каталог не получает пароль владельца кластера.
      RAG_PG_URL_FILE: /run/secrets/backup_url
      NEUROCENTER_MODEL_CREDENTIAL_KEY_FILE: /run/secrets/model_credential_key
      RAG_SERVICE_URL: http://rag-sync-service:4300
      SKILLS_SERVICE_URL: http://skills-service:4200
      API_GATEWAY_URL: http://api-gateway:4000
      PROJECTS_ROOT: /data/projects
      RUNTIME_ARTIFACT_DIR: /app/runtime-artifacts
      ASSET_SOURCE_MODE: ${ASSET_SOURCE_MODE:-online}
      BACKUP_DIR: /app/backups
      BACKUP_MAX_TOTAL_BYTES: ${BACKUP_MAX_TOTAL_BYTES:-68719476736}
      BACKUP_MAX_FILE_BYTES: ${BACKUP_MAX_FILE_BYTES:-17179869184}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags-service:4400
      MODEL_RUNTIME_URL: http://model-runtime:11434
      MODEL_CHAT_CONTEXT_WINDOW_TOKENS: ${MODEL_CHAT_CONTEXT_WINDOW_TOKENS:-4096}
      MODEL_STORAGE_PATH: /data/models
      MODEL_HOSTING_ENABLED: ${MODEL_HOSTING_ENABLED:-true}
    secrets: [metrics_token, internal_token, catalog_url, backup_url, model_credential_key]
    volumes: [projects:/data/projects, backups:/app/backups, runtime-artifacts:/app/runtime-artifacts, capacity:/capacity:ro, model-weights:/data/models:rw, help-content:/app/content/help]
    depends_on:
      capacity-collector: {condition: service_started}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:4100/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  feature-flags-service:
    <<: *service
    image: neurocenter/feature-flags-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/feature-flags-service/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      <<: *runtime
      PORT: 4400
      CATALOG_PG_URL_FILE: /run/secrets/catalog_url
      CATALOG_SERVICE_URL: http://catalog-service:4100
    secrets: [metrics_token, internal_token, catalog_url]
    depends_on:
      postgres: {condition: service_healthy}
      catalog-service: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:4400/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  skills-service:
    <<: *service
    image: neurocenter/skills-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/skills-service/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 512m
    cpus: 1
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      <<: *runtime
      CAPACITY_REQUIRED: 'true'
      PORT: 4200
      SKILLS_STORAGE_PATH: /app/data/skills
      CATALOG_SERVICE_URL: http://catalog-service:4100
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags-service:4400
    secrets: [metrics_token, internal_token]
    volumes: [skills:/app/data/skills, capacity:/capacity:ro]
    depends_on:
      capacity-collector: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:4200/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rag-sync-service:
    <<: *service
    image: neurocenter/rag-sync-service:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/rag-sync-service/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 2g
    cpus: 2
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      <<: *runtime
      CAPACITY_REQUIRED: 'true'
      PORT: 4300
      RAG_AUTH_DISABLED: 'false'
      RAG_DEFAULT_QUOTA_BYTES: ${RAG_DEFAULT_QUOTA_BYTES:-1073741824}
      RAG_MAX_QUOTA_BYTES: ${RAG_MAX_QUOTA_BYTES:-17179869184}
      RAG_PG_URL_FILE: /run/secrets/rag_url
      RAG_PROVISION_PG_URL_FILE: /run/secrets/rag_provision_url
      CATALOG_SERVICE_URL: http://catalog-service:4100
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags-service:4400
    secrets: [metrics_token, internal_token, rag_url, rag_provision_url]
    volumes: [projects:/data/projects:ro, capacity:/capacity:ro]
    depends_on:
      capacity-collector: {condition: service_started}
      postgres: {condition: service_healthy}
      catalog-service: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:4300/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  oauth2-bridge:
    <<: *service
    image: neurocenter/oauth2-bridge:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/oauth2-bridge/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 256m
    cpus: 1
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      <<: *runtime
      PORT: 22222
      SSO_DISABLE: 'false'
      SSO_HOST: ${SSO_HOST:?Заполните адрес Blitz}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:?Заполните Client ID Blitz}
      SSO_CLIENT_SECRET_FILE: /run/secrets/sso_client_secret
      REDIRECT_URI: ${REDIRECT_URI:?Заполните callback Blitz}
      SSO_SCOPE: ${SSO_SCOPE:-openid profile email}
      CATALOG_SERVICE_URL: http://catalog-service:4100
    secrets: [metrics_token, internal_token, sso_client_secret]
    depends_on:
      catalog-service: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:22222/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  api-gateway:
    <<: *service
    image: neurocenter/api-gateway:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: services/api-gateway/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 512m
    cpus: 1
    # AD-OP-6 (entry 2): user 1000 — USER образа (6.1); явное в compose = ратификация.
    user: 1000
    # AD-4: child-MCP — недоверенный «одобренный» артефакт: форк-бомба не роняет gateway (pids_limit),
    # процесс не root (USER в Dockerfile) и без привилегий (cap_drop).
    pids_limit: 128
    cap_drop: [ALL]
    environment:
      <<: *runtime
      PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      NEUROCENTER_TLS_PROXY_ADDRESSES: ${NEUROCENTER_TLS_PROXY_ADDRESSES:-}
      CATALOG_SERVICE_URL: http://catalog-service:4100
      SKILLS_SERVICE_URL: http://skills-service:4200
      RAG_SERVICE_URL: http://rag-sync-service:4300
      AUTH_SERVICE_URL: http://oauth2-bridge:22222
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags-service:4400
      # H5: без переменной fallback bridge.controller.ts резолвится в /bridge-dist, которого нет в образе (шаблоны в /app/bridge-dist).
      BRIDGE_TEMPLATES_DIR: /app/bridge-dist
      # AD-5: независимый секрет хоста mcp-host (отдельный trust-domain, без fallback на internal_token).
      NEUROCENTER_MCP_HOST_SECRET_FILE: /run/secrets/mcp_host_secret
      # AD-D2: персистентный volume кэша MCP-артефактов (LRU + per-project квота); без volume кэш сгорает при рестарте.
      NEUROCENTER_MCP_HOST_DIR: /data/gateway/mcp-host
      # AD-6 (entry 9): PG-счётчики pairing-окон — общий с catalog-базой URL (таблица rate_limit_windows).
      CATALOG_PG_URL_FILE: /run/secrets/catalog_url
    secrets: [metrics_token, internal_token, mcp_host_secret, catalog_url]
    volumes: [artifact-cache:/data/gateway/mcp-host]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:4000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    <<: *service
    image: neurocenter/frontend:${NEUROCENTER_RELEASE:?Заполните метку релиза}
    build: {context: ., dockerfile: frontend/Dockerfile, args: {NEUROCENTER_BUILD_CA_SHA256: "${NEUROCENTER_BUILD_CA_SHA256:-}", NEUROCENTER_BUILD_CA_NAME: "${NEUROCENTER_BUILD_CA_NAME:-.gitkeep}", NPM_REGISTRY_AUTH_B64: "${NPM_REGISTRY_AUTH_B64:-}", NEUROCENTER_TLS_DISABLE: "${NEUROCENTER_TLS_DISABLE:-0}", NEUROCENTER_NPM_STRICT_SSL: "${NEUROCENTER_NPM_STRICT_SSL:-true}"}}
    mem_limit: 128m
    cpus: 1
    # AD-OP-6 (entry 2): nginx master + worker'ы — фактические единицы PID, 64 — запас (OQ-2).
    pids_limit: 64
    # AD-OP-6 (entry 2): user 1000 — non-root nginx master (6.1); явное в compose = ратификация.
    user: 1000
    environment:
      NEUROCENTER_HOST: ${NEUROCENTER_HOST:?Заполните публичное DNS-имя}
    command: [/bin/sh, -ec, "envsubst '$$NEUROCENTER_HOST' < /etc/neurocenter/nginx.production.conf.template > /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"]
    secrets: [tls_cert, tls_key]
    ports: ['80:8080', '443:8443']
    networks: [backend, edge]
    depends_on:
      api-gateway: {condition: service_started}
      oauth2-bridge: {condition: service_started}
    healthcheck:
      # -Y off: busybox wget игнорирует no_proxy — без этого healthcheck идёт через HTTP(S)_PROXY окружения (502)
      test: [CMD, wget, -Y, off, --spider, --no-check-certificate, https://127.0.0.1:8443/ready]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # AD-OP-8: host-level-метрики через read-only-маунты; 9100 наружу не публикуется (scrape prometheus'ом в backend-сети).
  node_exporter:
    <<: *service
    image: prom/node-exporter:v1.9.1@sha256:863b62ff9f392b6f472e22b4b670ad1cabb66b3042502ebd4b2cd192733e1bce
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    # AD-OP-6 (entry 2): USER образа nobody (65534) — ратификация дефолта внешнего образа.
    user: 65534
    command:
      [
        --path.procfs=/host/proc,
        --path.sysfs=/host/sys,
        --path.rootfs=/host,
        --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/),
      ]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: [CMD, wget, -Y, off, --spider, http://127.0.0.1:9100/metrics]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # AD-O6: prometheus — compose-сервис в backend-сети; порты наружу НЕ публикуются
  # (9090 только internal, доступ оператора — ssh-tunnel / docker exec, документ в production-setup.md).
  # Scrape через metrics_token (deploy/production/monitoring/prometheus.yml, credentials_file /run/secrets/metrics_token).
  # State volume prometheus-data (named, tsdb) — DR-бандл AD-OP-2; digest-pin образа — часть release manifest (AD-OP-2).
  prometheus:
    <<: *service
    image: prom/prometheus:v3.0.0@sha256:3b9b2a15d376334da8c286d995777d3b9315aa666d2311170ada6059a517b74f
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    # AD-OP-6 (entry 2): USER образа nobody (65534) — ратификация дефолта внешнего образа.
    user: 65534
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=7d,
        --web.enable-lifecycle,
      ]
    secrets: [metrics_token]
    volumes:
      - ./deploy/production/monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -Y, off, --spider, http://127.0.0.1:9090/-/healthy]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # AD-O6: alertmanager — compose-сервис в backend-сети; порты наружу НЕ публикуются (9093 internal).
  # Канал доставки (webhook/email) и route — конфиг entry 13 (alertmanager.yml placeholder до entry 13).
  # State volume alertmanager-data (named); digest-pin — часть release manifest (AD-OP-2).
  alertmanager:
    <<: *service
    image: prom/alertmanager:v0.32.1@sha256:06a1e7960b1a68794ef943744082dc361dd352fd07ed3319ab6de3f929f38ad2
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # AD-OP-6 (entry 2): USER образа nobody (65534) — ратификация дефолта внешнего образа.
    user: 65534
    command:
      [
        --config.file=/etc/alertmanager/alertmanager.yml,
        --storage.path=/alertmanager,
      ]
    volumes:
      - ./deploy/production/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: [CMD, wget, -Y, off, --spider, http://127.0.0.1:9093/-/healthy]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  model_credential_key: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/model_credential_key'}
  metrics_token: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/metrics_token'}
  internal_token: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/internal_token'}
  mcp_host_secret: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/mcp_host_secret'}
  sso_client_secret: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/sso_client_secret'}
  postgres_password: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/postgres_password'}
  catalog_url: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/catalog_url'}
  rag_url: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/rag_url'}
  rag_provision_url: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/rag_provision_url'}
  backup_url: {file: '${NEUROCENTER_CONFIG_DIR:?}/secrets/backup_url'}
  tls_cert: {file: '${TLS_CERT_FILE:?Укажите сертификат TLS}'}
  tls_key: {file: '${TLS_KEY_FILE:?Укажите ключ TLS}'}
networks:
  backend: {}
  edge: {}
volumes:
  model-weights:
  capacity:
  postgres:
  background-agent-runtime:
  skills:
  projects:
  help-content:
  runtime-artifacts:
  backups:
  artifact-cache:
  prometheus-data:
  alertmanager-data:
