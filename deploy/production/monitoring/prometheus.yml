# Подключайте сборщик к backend-сети Compose. Порты сервисов наружу не публикуются.
# В сборщик передаётся только metrics_token, без internal_token и паролей PostgreSQL.
global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/neurocenter-alerts.yml

scrape_configs:
  - job_name: neurocenter
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - oauth2-bridge:22222
          - api-gateway:4000
          - catalog-service:4100
          - skills-service:4200
          - rag-sync-service:4300
          - feature-flags-service:4400
  # AD-OP-8: host-level-метрики (node_exporter, read-only-маунты); без Bearer — сервис не знает metrics_token.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node_exporter:9100
  # AD-O6 (ep6 entry 13): host-receiver — systemd-сервис НА ХОСТЕ (alert-receiver.service),
  # а не контейнер compose: отдельный job (не neurocenter), host-gateway через extra_hosts
  # у prometheus в compose.production.yml. Без Bearer — metrics_token неизвестен хосту.
  # Метрики: receiver_up (heartbeat), alerts_received_total, edge_cert_days_to_expiry.
  - job_name: alert-receiver
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9111
