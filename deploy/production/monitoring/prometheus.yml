# Подключайте сборщик к backend-сети Compose. Порты сервисов наружу не публикуются.
# В сборщик передаётся только metrics_token, без internal_token и паролей PostgreSQL.
global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/neurocenter-alerts.yml

scrape_configs:
  - job_name: neurocenter
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - oauth2-bridge:22222
          - api-gateway:4000
          - catalog-service:4100
          - skills-service:4200
          - rag-sync-service:4300
