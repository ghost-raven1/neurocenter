groups:
  - name: neurocenter-http
    rules:
      - alert: NeurocenterServiceUnavailable
        expr: up{job="neurocenter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Сервис Нейроцентра недоступен для сбора метрик'
      - alert: NeurocenterApiErrors
        expr: |
          sum by (service) (rate(neurocenter_http_requests_total{group="api",status=~"5.."}[5m]))
          / clamp_min(sum by (service) (rate(neurocenter_http_requests_total{group="api"}[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Больше 1% API-запросов завершаются ошибкой сервера'
      - alert: NeurocenterApiLatency
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(neurocenter_http_request_duration_seconds_bucket{group="api"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API p95 превышает 500 мс'
      - alert: NeurocenterCapacityUnavailable
        expr: neurocenter_capacity_snapshot_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Нет свежего замера физических томов; тяжёлые записи остановлены'
      - alert: NeurocenterDiskSpaceLow
        expr: neurocenter_capacity_free_bytes < 1073741824 or neurocenter_capacity_free_bytes / neurocenter_capacity_total_bytes < 0.15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Свободное место физического тома ниже резерва или 15 процентов'
      - alert: NeurocenterRagQueueGrowing
        expr: neurocenter_work_queue_pending{queue="rag"} > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Очередь базы знаний превышает восемь ожидающих запросов'
      - alert: NeurocenterExternalBackupOverdue
        expr: neurocenter_external_backup_verified == 0 or neurocenter_backup_rpo_exceeded == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Нет проверенной внешней копии в пределах цели RPO'
      - alert: NeurocenterBackupRunFailed
        expr: neurocenter_backup_last_run_failed == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Последний запуск полной копии завершился ошибкой'
      - alert: NeurocenterBackupStatusUnavailable
        expr: neurocenter_backup_status_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Статус внешних копий не обновляется; свежесть резервирования неизвестна'
  # AD-O6/AD-OP-7 (ep6 entry 13): правила, привязанные к каналу доставки (alertmanager.yml)
  # и host-метрикам (job alert-receiver — systemd host-receiver на хосте). 9 базовых выше —
  # ратификация, не переписываются; только добавление.
  - name: neurocenter-alerting
    rules:
      # Целый стек мёртв: ни один target job="neurocenter" не up (2m — эскалация над
      # ServiceUnavailable 1m). absent(up{job} == 1), а не count(up{job}) == 0 из плана:
      # (1) с static_configs серия up ВСЕГДА существует (6 target'ов) — при всех down
      # count(up{job}) == 6, литеральное выражение слепое; (2) count() по пустому вектору
      # возвращает ПУСТОЙ вектор (а не 0), так и count(up==1) == 0 никогда не сработает.
      # absent() срабатывает и при полном down, и при исчезновении job (slapping scrape-конфига).
      - alert: NeurocenterStackDown
        expr: absent(up{job="neurocenter"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Ни один сервис Нейроцентра не жив (стек мёртв)'
      # entry 6.10 (AD-O5): critical-события error-store за 5m → сигнал (warning —
      # порог HITL: наличие, не частота).
      - alert: NeurocenterErrorCritical
        expr: increase(neurocenter_error_events_total{level="critical"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Критические error-события в error-store за последние 5 минут'
      # AD-OP-7: edge-сертификат — gauge host-receiver (job alert-receiver).
      # Файл сертификата отсутствует → gauge NaN → сравнение не срабатывает (канал жив,
      # сертификат неизвестен — это видно в /metrics вручную, ложных алертов нет).
      - alert: NeurocenterCertExpiry
        expr: neurocenter_edge_cert_days_to_expiry < 14
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Меньше 14 дней до истечения edge-сертификата'
      - alert: NeurocenterCertExpiryCritical
        expr: neurocenter_edge_cert_days_to_expiry < 7
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 'Меньше 7 дней до истечения edge-сертификата'
      # Канал доставки down. Детект — up со scrape'а job="alert-receiver", а не
      # gauge neurocenter_alert_receiver_up == 0 из плана: с гибелью процесса gauge
      # исчезает из Prometheus, и «== 0» не сработает никогда (missing ≠ 0). up==0
      # срабатывает при падении receiver, закрытом порту и сломанном DNS host-gateway.
      - alert: NeurocenterAlertReceiverDown
        expr: up{job="alert-receiver"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Канал алертов (host-receiver) недоступен — алерты не доставляются'
